<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laminário de Mama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bancada de microscopia — bandeja de lâminas | platina escura | ficha da lâmina */
:root{
  --bg:#efeef4; --panel:#fafafc; --ink:#1c1928; --muted:#5f5a73; --line:#dcd9e6;
  --hema:#3f3794; --hema-soft:#e7e4f7; --eosin:#b23f6c; --eosin-soft:#f7e4ec;
  --ok:#1f7a4d; --ok-soft:#dff3e8; --bad:#b3372f; --bad-soft:#fbe3e0;
  --stage:#0f0d15; --stage-ink:#ece9f6; --stage-dim:#aaa5bf; --stage-line:rgba(236,233,246,.16); --stage-glass:rgba(17,15,25,.82);
  --pin:#ee82ad;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --panel:#19171f; --ink:#ebe8f3; --muted:#a39eb6; --line:#2c2838;
  --hema:#a69ef3; --hema-soft:#27233f; --eosin:#ee82ad; --eosin-soft:#3a1f2c;
  --ok:#6fd49c; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --panel:#19171f; --ink:#ebe8f3; --muted:#a39eb6; --line:#2c2838;
  --hema:#a69ef3; --hema-soft:#27233f; --eosin:#ee82ad; --eosin-soft:#3a1f2c;
  --ok:#6fd49c; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1c1a; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--hema);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand .name{font-family:var(--display);font-weight:650;font-size:19px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:500}
.act svg{width:16px;height:16px}
.act[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--panel)}
.demo{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--eosin);background:var(--eosin-soft);padding:4px 10px;border-radius:999px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr) 368px}
.catalog,.record{overflow:auto;background:var(--panel);min-width:0}
.catalog{border-right:1px solid var(--line);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:12px}
.catalog.locked{opacity:.45;pointer-events:none}
.record{border-left:1px solid var(--line);padding-block:18px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}

.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
#busca{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--hema);border-color:var(--hema);color:var(--panel)}
.switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--hema);margin:0}
.group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 2px 7px}
.slides{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.slide{width:100%;display:grid;grid-template-columns:72px minmax(0,1fr);gap:11px;align-items:center;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 7px}
.slide:hover{background:var(--bg)}
.slide[aria-current="true"]{background:var(--hema-soft);border-color:color-mix(in srgb,var(--hema) 35%,transparent)}
.thumb{width:72px;height:48px;border-radius:5px;display:block;background:#f2f1f5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.slide b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.slide small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.slide code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px}

.stage{position:relative;background:var(--stage);min-height:0;overflow:hidden}
.pane{position:absolute;inset:0}
.pane2{border-left:1px solid var(--stage-line)}
.stage.split .pane1{right:50%}
.stage.split .pane2{left:50%}
#viewer,#viewer2{position:absolute!important;inset:0}
.annot{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.labels{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.lab{position:absolute;transform:translate(0,-100%);background:rgba(11,10,16,.84);color:#fff;font:500 12px/1.3 var(--body);padding:3px 7px;border-radius:6px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c,#ffd84d)}
.lab.sel{outline:2px solid var(--c,#ffd84d)}
.stage.nopins .annot,.stage.nopins .labels,.stage.quiz .annot,.stage.quiz .labels{display:none}
.stage.drawing #viewer{cursor:crosshair}
.reticle{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px dashed #fff;border-radius:50%;z-index:4;pointer-events:none;box-shadow:0 0 0 2px rgba(11,10,16,.7),inset 0 0 0 2px rgba(11,10,16,.7)}
.toolbar{position:absolute;top:12px;left:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 130px);z-index:6}
.seg{display:flex;background:var(--stage-glass);border:1px solid var(--stage-line);border-radius:10px;overflow:hidden;backdrop-filter:blur(6px)}
.seg button{background:transparent;border:0;color:var(--stage-ink);padding:7px 10px;font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;min-height:34px}
.seg button+button{border-left:1px solid var(--stage-line)}
.seg button:hover{background:rgba(236,233,246,.08)}
.seg button[aria-pressed="true"]{background:var(--pin);color:#160f15}
.seg svg{width:16px;height:16px;display:block}
.stage.quiz #tools,.stage.quiz #bt-pins{display:none}
.hud{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;
  background:var(--stage-glass);border:1px solid var(--stage-line);border-radius:10px;padding:8px 12px;color:var(--stage-ink);font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;max-width:calc(100% - 24px);box-sizing:border-box}
.scale{display:flex;flex-direction:column;gap:3px}
.scale .bar{height:5px;border:2px solid var(--stage-ink);border-top:0;transition:width .15s}
.mag{font-size:17px;font-weight:500;line-height:1}
.mag small{display:block;font-size:10px;color:var(--stage-dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.coords{color:var(--stage-dim);font-size:11.5px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:68px;z-index:6;background:var(--stage-glass);border:1px solid var(--stage-line);color:var(--stage-ink);font-size:12.5px;border-radius:999px;padding:6px 14px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.busy{position:absolute;right:12px;bottom:12px;z-index:6;background:var(--stage-glass);border:1px solid var(--stage-line);color:var(--stage-dim);font-family:var(--mono);font-size:11.5px;border-radius:999px;padding:5px 11px;display:flex;align-items:center;gap:7px}
.busy::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pin);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.cmpbar{position:absolute;top:12px;left:12px;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--stage-glass);border:1px solid var(--stage-line);border-radius:10px;padding:6px 8px;color:var(--stage-ink);font-size:12.5px;max-width:calc(100% - 120px)}
.cmpbar select{background:#1d1a27;color:var(--stage-ink);border:1px solid var(--stage-line);border-radius:7px;padding:4px 6px;font:inherit;font-size:12.5px;max-width:190px}
.cmpbar label{display:flex;align-items:center;gap:6px}
.cmpbar input{accent-color:var(--pin);margin:0}
.cmpbar button{background:transparent;border:1px solid var(--stage-line);color:var(--stage-ink);border-radius:7px;padding:4px 8px;font-size:12px}

.editor{position:absolute;z-index:8;width:270px;max-width:calc(100% - 24px);box-sizing:border-box;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:9px}
.editor textarea{width:100%;box-sizing:border-box;resize:vertical;min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:7px 9px;font:inherit;font-size:14px}
.selp{width:290px}
.lab.poilab{background:rgba(11,10,16,.9);font-weight:600}
.stage.nopins .lab.poilab{display:none}
.editor .meas{font-family:var(--mono);font-size:12.5px;color:var(--hema)}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--hema);border-color:var(--hema);color:var(--panel)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.err{margin:0;color:var(--bad);font-size:12.5px}

.pin{width:26px;height:26px;border-radius:50%;background:rgba(15,13,21,.86);border:2px solid var(--pin);color:#fff;font:500 12px/22px var(--mono);text-align:center;box-sizing:border-box;cursor:pointer;box-shadow:0 0 0 3px rgba(15,13,21,.35)}
.pin.on{background:var(--pin);color:#160f15;transform:scale(1.15)}
.stage.nopins .pin,.stage.quiz .pin,.stage.hidepins .pin{display:none!important}
[hidden]{display:none!important}

.eyebrow{margin:0;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--eosin);font-weight:600}
.record h1{font-family:var(--display);font-weight:650;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:6px 0 6px;text-wrap:balance}
.file{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:transparent;border:0;border-bottom:2px solid transparent;padding:7px 10px 8px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--eosin)}
.desc{margin:0 0 18px;max-width:62ch}
.record h2{font-family:var(--display);font-weight:500;font-size:16.5px;margin:0 0 10px;letter-spacing:-.005em}
.stepper{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.stepper span{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}
.pois{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:2px}
.poi{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px}
.poi:hover{background:var(--bg)}
.poi[aria-current="true"]{background:var(--eosin-soft);border-color:color-mix(in srgb,var(--eosin) 35%,transparent)}
.poi .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--eosin);color:var(--eosin);font:500 11.5px/21px var(--mono);text-align:center;box-sizing:border-box}
.poi[aria-current="true"] .n{background:var(--eosin);color:var(--panel)}
.poi b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.poi small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.m{font-family:var(--mono);font-size:11.5px;color:var(--hema);background:var(--hema-soft);border-radius:6px;padding:2px 6px;white-space:nowrap}
dl.ficha,dl.caso{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:0 0 18px;font-size:13.5px}
dl.ficha dt,dl.caso dt{color:var(--muted)}
dl.ficha dd,dl.caso dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dl.ficha .mono{font-family:var(--mono);font-size:12.5px}
.note{margin:16px 0 0;font-size:12.5px;color:var(--muted);max-width:62ch;border-top:1px solid var(--line);padding-top:12px}
.opts{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 12px;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--hema)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt:disabled{opacity:1;cursor:default}
.fb{border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13.5px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.checks{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:3px;accent-color:var(--ok)}
.ddx{margin:0 0 18px;padding-left:18px;font-size:13.5px}
.score{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.notes{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.nitem{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;grid-template-columns:12px minmax(0,1fr);gap:4px 10px}
.nitem.sel{border-color:var(--hema);background:var(--hema-soft)}
.nitem .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.nitem b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.nitem small{display:block;color:var(--muted);font-size:12px}
.nitem .row{grid-column:2}
.nitem .row button{font-size:12.5px;padding:3px 9px}
.status{font-size:12.5px;color:var(--muted);margin:0 0 12px;display:flex;gap:7px;align-items:center}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc,var(--muted));flex:none}

.gwrap{overflow-x:auto;margin:0 0 12px}
.gtab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.gtab th,.gtab td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gtab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gtab td:first-child{font-weight:600;white-space:nowrap}
.record h2+.gwrap{margin-top:0}
.record .desc+h2,.record .gwrap+h2,.record ul+h2{margin-top:18px}
@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column}
  .catalog{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .slides{flex-direction:row;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .slides li{flex:0 0 236px;scroll-snap-align:start}
  .group{display:none}
  .stage{height:70vh;min-height:420px}
  .stage.split .pane1{right:0;bottom:50%}
  .stage.split .pane2{left:0;top:50%;border-left:0;border-top:1px solid var(--stage-line)}
  .record{border-left:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .toolbar{max-width:calc(100% - 96px)}
  .hint{bottom:auto;top:100px}
}
@media (prefers-reduced-motion:reduce){.busy::before{animation:none}.scale .bar{transition:none}}
</style>

<header class="top">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/><circle cx="14" cy="14" r="10" fill="#f2c6d8"/><circle cx="10" cy="11" r="2.4" fill="#8a4a1f"/><circle cx="17" cy="9.5" r="2" fill="#4b3f9a"/><circle cx="16" cy="17" r="2.6" fill="#4b3f9a"/><circle cx="9.5" cy="18" r="1.8" fill="#4b3f9a"/></svg>
    <div><div class="name">Laminário de Mama</div><div class="sub">Histologia e patologia mamária · IHQ e FISH</div></div>
  </div>
  <div class="actions">
    <button type="button" class="act" id="bt-guia" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3h4.2c.7 0 1.3.6 1.3 1.3V13c0-.6-.5-1-1.1-1H2.5z"/><path d="M13.5 3H9.3C8.6 3 8 3.6 8 4.3V13c0-.6.5-1 1.1-1h4.4z"/></svg>Guia</button>
    <button type="button" class="act" id="bt-quiz" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.3"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4"/><circle cx="8" cy="11.6" r=".5" fill="currentColor"/></svg>Quiz</button>
    <button type="button" class="act" id="bt-cmp" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M8 2.5v11"/></svg>Comparar</button>
    <span class="demo">Demonstração · lâminas sintéticas</span>
  </div>
</header>

<main class="app">
  <aside class="catalog" id="catalog" aria-label="Acervo de lâminas">
    <label class="label" for="busca">Buscar lâmina</label>
    <input id="busca" type="search" placeholder="Lesão, marcador ou arquivo" autocomplete="off">
    <div class="chips" id="grupos" role="group" aria-label="Filtrar por área"></div>
    <label class="switch" for="cego"><input type="checkbox" id="cego">Ocultar diagnósticos (modo caso)</label>
    <ol class="slides" id="lista"></ol>
    <p class="empty" id="vazio" hidden>Nenhuma lâmina encontrada. Tente outro termo.</p>
  </aside>

  <section class="stage" id="stage" aria-label="Visualizador da lâmina">
    <div class="pane pane1" id="pane1">
      <div id="viewer"></div>
      <svg class="annot" id="annot" aria-hidden="true"></svg>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="reticle" id="reticle" hidden></div>
      <div class="editor selp" id="selp" hidden role="dialog" aria-label="Área selecionada">

<script>
/* ---------- Renderizador procedural (roda em workers e na página) ---------- */
function rendererFactory(){
  const W=98304,H=65536;
  let E=0,Hb=0,CELL=0,LUM=0,NUCOK=-1,NUCMUL=1,NUCSZ=1,NANG=NaN,EDGE=0,RN=0,DS=0,ANG=0;
  const NR=new Float64Array(5),A=new Float64Array(5),B=new Float64Array(5),Q=new Float64Array(5);
  function h2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
  function clamp(v){return v<0?0:v>1?1:v;}
  function ss(a,b,x){const t=clamp((x-a)/(b-a));return t*t*(3-2*t);}
  function vn(x,y,s){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
    const a=h2(ix,iy,s),b=h2(ix+1,iy,s),c=h2(ix,iy+1,s),d=h2(ix+1,iy+1,s);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;}
  function fbm(x,y,L,seed,o,s){let v=0,a=0.5,n=0,wl=L;for(let i=0;i<o;i++){v+=a*(wl>2.5*s?vn(x/wl,y/wl,seed+i*101):0.5);n+=a;a*=0.5;wl*=0.5;}return v/n;}
  function worley(x,y,C,seed,jit,R){const gx=x/C,gy=y/C,ix=Math.floor(gx),iy=Math.floor(gy);let f1=1e9,f2=1e9,hb=0,bx=0,by=0;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=ix+i,cy=iy+j;
      const px=cx+0.5+(h2(cx,cy,seed)-0.5)*jit,py=cy+0.5+(h2(cx,cy,seed+7)-0.5)*jit;const dx=gx-px,dy=gy-py,d=dx*dx+dy*dy;
      if(d<f1){f2=f1;f1=d;hb=h2(cx,cy,seed+13);bx=dx;by=dy;}else if(d<f2)f2=d;}
    R[0]=Math.sqrt(f1)*C;R[1]=Math.sqrt(f2)*C;R[2]=hb;R[3]=bx*C;R[4]=by*C;}
  function blob(x,y,s,seed,rx,ry,rough){const ax=W*rx,ay=H*ry,nx=(x-W/2)/ax,ny=(y-H/2)/ay,r=Math.sqrt(nx*nx+ny*ny);RN=r;
    const n=fbm(x,y,14000,seed,6,s);EDGE=(1-r+(n-0.5)*rough)*Math.min(ax,ay);return clamp(0.5+EDGE/Math.max(2*s,24));}
  function strip(x,y,s,seed){const y0=H*0.2+900*Math.sin(x/8000+seed)+2200*(fbm(x,0,16000,seed+2,4,s)-0.5);DS=y-y0;
    const bottom=H*0.86+1500*(fbm(x,7,9000,seed+3,4,s)-0.5),side=Math.min(x-W*0.05,W*0.95-x)+1200*(fbm(0,y,9000,seed+4,3,s)-0.5);
    const fw=Math.max(2*s,16);EDGE=Math.min(DS,bottom-y,side);RN=0;return clamp(0.5+DS/fw)*clamp(0.5+(bottom-y)/fw)*clamp(0.5+side/fw);}
  function stroma(x,y,s,seed,base){const fib=fbm(x*0.45+240*Math.sin(y/800),y,480,seed,4,s),fw=clamp(50/s-0.3);
    E=base+0.32*(fib-0.5);LUM=(1-ss(0.3,0.36,fib))*0.45*fw+(1-fw)*0.08;CELL=0.1;Hb=0.015;}
  function vessels(x,y,s,C,seed){worley(x,y,C,seed,0.9,A);const fe=Math.max(s,8),vr=50+150*A[2]*A[2];
    if(A[0]<vr+60){const ring=1-ss(vr,vr+60,A[0]),lu=1-ss(vr-fe,vr+fe,A[0]);E=E*(1-ring)+0.55*ring;CELL=CELL*(1-ring)+0.75*ring*(1-lu);LUM=Math.max(lu*0.94,LUM*(1-ring));NUCOK=1-lu;}}

  let REG=0,TUM=0,NORMC=0,DDv=1,SP=0;
  const F=new Float64Array(5),G2=new Float64Array(5),STK=new Float64Array(12*6);

  function rs(){E=0;Hb=0;CELL=0;LUM=0;NUCOK=-1;NUCMUL=1;NUCSZ=1;NANG=NaN;TUM=0;NORMC=0;}
  function sv(){if(NUCOK<0)NUCOK=1-LUM;const o=SP*12;STK[o]=E;STK[o+1]=Hb;STK[o+2]=CELL;STK[o+3]=LUM;STK[o+4]=NUCSZ;STK[o+5]=NUCMUL;STK[o+6]=NUCOK;STK[o+7]=TUM;STK[o+8]=NORMC;STK[o+9]=REG;STK[o+10]=NANG;SP++;rs();}

    E=STK[o]*j+E*k;Hb=STK[o+1]*j+Hb*k;CELL=STK[o+2]*j+CELL*k;LUM=STK[o+3]*j+LUM*k;NUCSZ=STK[o+4]*j+NUCSZ*k;NUCMUL=STK[o+5]*j+NUCMUL*k;NUCOK=STK[o+6]*j+NUCOK*k;
    if(k<=0.5){TUM=STK[o+7];NORMC=STK[o+8];REG=STK[o+9];NANG=STK[o+10];}}

    E=0.55;LUM=(1-mem)*(0.97*aw+0.85*(1-aw));CELL=0.3*mem;NUCOK=mem;NUCSZ=0.8;REG=1;}
  function loose(x,y,s,seed){const t=fbm(x,y,140,seed,3,s),lw=clamp(30/s-0.3);E=0.24+0.08*t;LUM=(0.22+0.2*ss(0.45,0.6,t))*lw+(1-lw)*0.2;CELL=0.32;NUCSZ=0.8;Hb=0.03;REG=3;}
  function dense(x,y,s,seed){stroma(x,y,s,seed,0.6);CELL=0.08;REG=2;}
  function desmo(x,y,s,seed){stroma(x,y,s,seed,0.5);CELL=0.3;NUCSZ=0.9;REG=11;}
  function outerBreast(x,y,s,sd){fat(x,y,s,sd+9);const p=ss(0.55,0.62,fbm(x,y,10000,sd+10,4,s));if(p>0){sv();dense(x,y,s,sd+11);mix(p);}}
  function tumorCell(at,mito){E=0.4;Hb=0.06;CELL=1.75;NUCSZ=at;NUCMUL=1.2;TUM=1;REG=7;
    if(mito>0&&DDv>0&&frac(NR[2]*977.3)<mito){NUCMUL=2.3;NUCSZ=at*0.85;REG=13;}}
  /* unidade glandular (ácino/ducto): R = resultado de worley, ri = raio externo, lr = raio do lúmen */
  function gland(R,ri,s,lr,myo,secr,lumReg){const fe=Math.max(s,4),bd=ri-R[0],ang=Math.atan2(R[4],R[3]);
    if(bd<12){E=0.56;Hb=0.02;CELL=0;NUCOK=0;REG=6;return;}
    if(myo&&bd<40){E=0.2;LUM=0.3;Hb=0.03;CELL=1.6;NUCSZ=0.72;NUCMUL=1.15;NANG=ang+Math.PI/2;REG=6;return;}
    if(R[0]<lr){const lw=clamp(8/s-0.2);if(secr){E=0.24;LUM=0.55;}else LUM=0.93*lw+0.6*(1-lw);CELL=0;NUCOK=0;REG=lumReg||4;return;}
    E=0.36;Hb=0.05;CELL=1.7;NUCMUL=1.05;NANG=ang;REG=5;NORMC=1;
    if(R[0]<lr+fe)LUM=(1-clamp((R[0]-lr)/fe))*0.8;}

  /* carcinoma invasivo de tipo não especial (também base das lâminas de IHQ) */
  function nst(x,y,s,sd,g){
    const fe=Math.max(s,6),t=(0.6-RN)+0.32*(fbm(x,y,9000,sd+1,4,s)-0.5),at=g===3?1.45:1.15;
    if(t<-0.13){outerBreast(x,y,s,sd);return;}
    if(t<0){outerBreast(x,y,s,sd);const p=1+t/0.13;worley(x,y,620,sd+6,0.9,A);
      if(A[2]<0.5*p){const ri=(50+110*frac(A[2]*31.7))*(0.8+0.4*fbm(x,y,300,sd+7,2,s)),bd=ri-A[0];
        if(bd>-fe){const k=clamp(0.5+bd/fe);sv();tumorCell(at,0.02);REG=23;mix(k);}}
      return;}
    desmo(x,y,s,sd+2);
    const til=ss(0.6,0.7,fbm(x,y,2600,sd+3,3,s));
    if(til>0){CELL+=1.5*til;NUCSZ=1-0.4*til;NUCMUL=1+0.4*til;E*=1-0.4*til;if(til>0.5)REG=10;}
    worley(x,y,7000,sd+8,0.8,Q);
    if(Q[2]<0.22){const ri=230+80*frac(Q[2]*17.9),bd=ri-Q[0];
      if(bd>-fe){const k=clamp(0.5+bd/fe);sv();gland(Q,ri,s,ri*0.4,true,false,22);mix(k);return;}}
    worley(x,y,1300,sd+4,0.9,A);
    if(A[2]<0.86){const ri=(g===3?(320+560*frac(A[2]*53.7)):(200+380*frac(A[2]*53.7)))*(0.7+0.6*fbm(x,y,520,sd+5,3,s)),bd=ri-A[0];
      if(bd>-fe){const k=clamp(0.5+bd/fe);sv();tumorCell(at,g===3?0.03:0.008);
        const tub=g===3?0.07:0.3;

        else if(g===3&&A[2]>0.76&&A[0]<ri*0.3){E=0.6;LUM=0.06;CELL=0.3;NUCSZ=0.4;NUCMUL=1.6;TUM=0;REG=8;}
        mix(k);}}
  }
  /* carcinoma lobular invasivo (também base da E-caderina) */
  function lob(x,y,s,sd){
    const fe=Math.max(s,5),t=(0.62-RN)+0.3*(fbm(x,y,9000,sd+1,4,s)-0.5);
    worley(x,y,8500,sd+2,0.7,B);let dd=1e9,ri=0,lcis=false;const near=B[2]<0.42;
    if(near){lcis=B[2]<0.13;ri=lcis?(560+200*frac(B[2]*19.3)):(260+90*frac(B[2]*19.3));dd=B[0];}
    const base=()=>{if(t>0)desmo(x,y,s,sd+3);else outerBreast(x,y,s,sd);};
    if(dd<ri+fe){const k=clamp(0.5+(ri-dd)/fe);base();sv();
      if(lcis){gland(B,ri,s,0,true,false,4);if(REG===5){tumorCell(0.9,0);E=0.34;LUM=0.06;REG=16;NORMC=0;NANG=NaN;}}
      else gland(B,ri,s,ri*0.4,true,false,22);
      mix(k);return;}
    if(t<-0.1){outerBreast(x,y,s,sd);return;}
    base();
    const cx=DDv>0?x-NR[3]:x,cy=DDv>0?y-NR[4]:y;let ph,ang;
    if(near&&dd<ri+1500){const dcx=cx-(x-B[3]),dcy=cy-(y-B[4]);ph=(Math.hypot(dcx,dcy)-ri)/165;ang=Math.atan2(dcy,dcx)+Math.PI/2;}
    else{ph=(cy+2600*(fbm(cx,cy,9000,sd+4,3,s)-0.5)+0.18*cx)/165;ang=Math.atan(0.18);}
    const dsr=Math.abs(frac(ph)-0.5)*165,gap=fbm(cx,cy,420,sd+5,2,s),dens=t>0?1:clamp(1+t/0.1);
    if(gap>0.38&&dens>0&&dsr<26){const k=clamp((gap-0.38)/0.06)*dens*(DDv>0?1:clamp(0.5+(22-dsr)/fe));
      sv();tumorCell(0.85,0.002);E=0.33;LUM=0.05;REG=17;NANG=ang;mix(k);}
  }
  /* tecido para FISH: ninhos tumorais e estroma (só importa a geometria nuclear) */
  function fishTissue(x,y,s,sd){
    const cx=DDv>0?x-NR[3]:x,cy=DDv>0?y-NR[4]:y;
    CELL=0.14;NUCSZ=0.75;REG=21;NANG=0.6+0.8*fbm(x,y,3000,sd+2,2,s);
    worley(cx,cy,1500,sd+1,0.9,A);
    if(A[2]<0.8){const ri=(320+480*frac(A[2]*53.7))*(0.75+0.5*fbm(cx,cy,600,sd+3,3,s));if(ri-A[0]>0){CELL=1.8;NUCSZ=1.12;TUM=1;REG=20;NANG=NaN;}}
  }

  const SL={
    normal:{seed:301,C:40,rf:0.22,Hn:1.25,elong:0.7,
      mask:(x,y,s)=>blob(x,y,s,301,0.42,0.40,0.5),
      shade(x,y,s,d){const fe=Math.max(s,6);
        worley(x,y,10000,302,0.5,B);let dl=-1e9;
        if(B[2]<0.6){const rl=(1500+800*frac(B[2]*37.7))*(0.9+0.2*fbm(x,y,2500,303,3,s));dl=rl-B[0];}

        fat(x,y,s,305);if(dn>0){sv();dense(x,y,s,306);mix(dn);}
        if(dl<-450){worley(x,y,6000,307,0.8,Q);
          if(Q[2]<0.3){const ri=230+120*frac(Q[2]*41.3),bd=ri-Q[0];
            if(bd>-260){if(bd<0){const c=1-ss(0,260,-bd);sv();loose(x,y,s,310);mix(c);}
              else{const k=clamp(0.5+bd/fe);sv();gland(Q,ri,s,ri*0.45,true,false,22);mix(k);}}}}
        if(dl>-fe){const k=clamp(0.5+dl/fe);sv();loose(x,y,s,308);
          worley(x,y,340,309,0.85,A);
          if(A[2]<0.9){const ra=95+40*frac(A[2]*61.3),bd=ra-A[0];if(bd>-fe){const k2=clamp(0.5+bd/fe);sv();gland(A,ra,s,ra*0.3,true,false,4);mix(k2);}}

    fibroadenoma:{seed:311,C:40,rf:0.21,Hn:1.2,elong:0.9,
      mask(x,y,s){const m=blob(x,y,s,311,0.45,0.43,0.4),nx=(x-W*0.5)/(W*0.31),ny=(y-H*0.5)/(H*0.36);
        DS=(1-(Math.sqrt(nx*nx+ny*ny)+0.1*(fbm(x,y,9000,312,4,s)-0.5)))*H*0.36;return m;},
      shade(x,y,s,d){const fe=Math.max(s,5);
        if(DS<0){if(DS>-450){stroma(x,y,s,313,0.62);CELL=0.1;NANG=Math.atan2(y-H/2,x-W/2)+Math.PI/2;REG=15;return;}outerBreast(x,y,s,314);return;}
        const fib=fbm(x,y,260,315,3,s),lw=clamp(30/s-0.3);
        E=0.26+0.12*fib;LUM=(0.18+0.18*ss(0.45,0.62,fib))*lw+(1-lw)*0.2;CELL=0.48;NUCSZ=0.85;Hb=0.03;NANG=6.28*fbm(x,y,4000,316,2,s);REG=18;
        if(DS<300){const c=1-ss(0,300,DS);E+=0.2*c;CELL-=0.25*c;}
        worley(x,y,1500,317,0.8,A);

              else{E=0.22;LUM=0.25;CELL=1.5;NUCSZ=0.72;NANG=a;REG=6;}
              mix(k);}}}

   aula:[['Conceito','Neoplasia fibroepitelial benigna mais comum, típica de mulheres jovens. Há proliferação conjunta de estroma e epitélio; o componente que define o comportamento é o estroma.'],
     ['Padrões','No padrão intracanalicular o estroma empurra e comprime os ductos, que viram fendas curvas. No pericanalicular, o estroma se dispõe ao redor de ductos que mantêm lúmen redondo. Os dois costumam coexistir e não têm importância prognóstica.'],
     ['Diagnóstico diferencial','O principal é o tumor filoide. Favorecem filoide: estroma hipercelular, sobretudo junto ao epitélio, padrão em folhas (projeções em fenda com estroma celular), crescimento estromal exuberante, mitoses estromais e bordas infiltrativas. Na biópsia por agulha grossa a distinção pode ser difícil e a lesão fibroepitelial celular costuma ser excisada.'],
     ['Conduta','Com tríplice avaliação concordante (clínica, imagem e patologia), o seguimento é suficiente. Lesões grandes, sintomáticas ou em crescimento rápido podem ser excisadas.']]},

  {id:'cdis',grupo:PM,cat:'Carcinoma in situ',nome:'Carcinoma ductal in situ',tipo:'Neoplasia epitelial não invasiva',coloracao:'H&E',arquivo:'MA-CDIS-012.svs',tamanho:'1,61 GB',scanner:'Aperio GT 450',
   desc:'Ductos expandidos por proliferação de células epiteliais atípicas, com camada mioepitelial preservada e sem invasão do estroma. Alguns ductos mostram padrão cribriforme, com espaços redondos e rígidos; outros têm células de alto grau nuclear e necrose central do tipo comedo, com microcalcificações. Há infiltrado linfocitário periductal.',
   caso:{paciente:'Mulher, 54 anos',local:'Mama esquerda, quadrante superolateral',clinico:'Assintomática; alteração no rastreamento mamográfico. Exame físico sem nódulo palpável.',imagem:'Mamografia: microcalcificações pleomórficas finas, lineares e ramificadas, em distribuição segmentar, de 3 cm (BI-RADS 4C). Biópsia estereotáxica a vácuo.',
     ddx:['Hiperplasia ductal usual','Carcinoma invasivo de tipo não especial','Carcinoma lobular in situ'],
     achados:['Ductos expandidos por células atípicas monótonas','Padrão cribriforme com espaços rígidos','Necrose central tipo comedo','Microcalcificações na necrose','Camada mioepitelial preservada (sem invasão)']},
   aula:[['Conceito','Proliferação neoplásica de células epiteliais confinada ao sistema ductolobular, com mioepitélio e membrana basal preservados. É precursor não obrigatório do carcinoma invasivo e não dá metástase.'],
     ['Classificação','Graduado pelo grau nuclear (baixo, intermediário e alto), pela presença de necrose (comedonecrose quando central e extensa) e pelo padrão arquitetural: cribriforme, sólido, micropapilar, papilar e plano. O alto grau com comedonecrose é o que mais se associa a calcificações lineares ramificadas na mamografia.'],
     ['Como confirmar que não há invasão','Procure a camada mioepitelial em toda a periferia dos ninhos. Em casos duvidosos, a IHQ para p63 e calponina mostra o mioepitélio. Microinvasão é um foco invasivo de até 1 mm.'],
     ['Por que importa','O laudo deve trazer grau nuclear, necrose, padrão, extensão, margens e status de RE. Isso orienta a cirurgia (setorectomia ou mastectomia), a radioterapia e a hormonioterapia adjuvante.']]},

  {id:'cdi',grupo:PM,cat:'Carcinomas invasivos',nome:'Carcinoma invasivo de tipo não especial, grau 3',tipo:'Carcinoma invasivo (antigo ductal invasivo)',coloracao:'H&E',arquivo:'MA-CINE-031.svs',tamanho:'1,98 GB',scanner:'Aperio GT 450',
   desc:'Carcinoma invasivo de tipo não especial (NST), antes chamado ductal invasivo. Lençóis e ninhos sólidos de células com pleomorfismo nuclear acentuado infiltram estroma desmoplásico e o tecido adiposo da periferia. Quase não há formação tubular, as mitoses são frequentes e existem focos de necrose e de linfócitos infiltrantes do tumor (TILs).',
   caso:{paciente:'Mulher, 47 anos',local:'Mama esquerda, junção dos quadrantes superiores',clinico:'Nódulo endurecido de 3 cm, pouco móvel, percebido há 2 meses. Linfonodo axilar homolateral palpável.',imagem:'Mamografia: massa irregular de margens espiculadas (BI-RADS 5). Ultrassonografia axilar com linfonodo de córtex espessado.',
     ddx:['Carcinoma lobular invasivo','Carcinoma tubular','Carcinoma com padrão medular'],
     achados:['Ninhos e lençóis sólidos, com menos de 10% de túbulos','Pleomorfismo nuclear acentuado','Mitoses frequentes','Estroma desmoplásico','Infiltração do tecido adiposo','Ausência de camada mioepitelial ao redor dos ninhos']},
   aula:[['Conceito','É o tipo histológico mais comum, entre 70% e 80% dos carcinomas invasivos. O nome NST indica que o tumor não preenche os critérios de nenhum tipo especial (lobular, tubular, mucinoso e outros).'],
     ['Graduação de Nottingham nesta lâmina','A graduação histológica soma três escores de 1 a 3. Formação tubular: menos de 10% (3). Pleomorfismo nuclear: núcleos grandes, vesiculosos e variáveis (3). Mitoses: contagem alta em 10 campos de grande aumento, ajustada ao diâmetro do campo (3). Total 9, grau 3. Somas de 3 a 5 são grau 1; 6 e 7, grau 2; 8 e 9, grau 3.'],
     ['O que mais entra no laudo','Tamanho, grau, invasão linfovascular, TILs no estroma, componente in situ associado, margens e linfonodos. Os biomarcadores RE, RP, HER2 e Ki-67 são obrigatórios e definem o subtipo e o tratamento sistêmico.'],
     ['Veja também','As lâminas de biomarcadores usam este mesmo tipo de tumor. Compare a H&E com RE, Ki-67 e as três intensidades de HER2.']]},

  {id:'tubular',grupo:PM,cat:'Carcinomas invasivos',nome:'Carcinoma tubular',tipo:'Carcinoma invasivo de tipo especial',coloracao:'H&E',arquivo:'MA-TUB-009.svs',tamanho:'1,22 GB',scanner:'Aperio GT 450',
   desc:'Carcinoma invasivo bem diferenciado formado quase só por túbulos angulados, em forma de gota, com lúmen aberto e uma única camada de células cúbicas de atipia leve. Não há camada mioepitelial. Os túbulos ficam em estroma desmoplásico celular e infiltram a gordura na periferia.',
   caso:{paciente:'Mulher, 61 anos',local:'Mama direita, quadrante superolateral',clinico:'Assintomática; achado no rastreamento.',imagem:'Mamografia: pequena lesão espiculada de 9 mm (BI-RADS 4C). Biópsia por agulha grossa guiada por ultrassonografia.',
     ddx:['Adenose esclerosante','Cicatriz radial','Carcinoma invasivo de tipo não especial, grau 1'],
     achados:['Mais de 90% do tumor formado por túbulos','Túbulos angulados com lúmen aberto','Camada única de células, sem mioepitélio','Atipia nuclear leve e mitoses raras','Estroma desmoplásico']},
   aula:[['Conceito','Tipo especial de carcinoma invasivo, de excelente prognóstico. Pela OMS, mais de 90% do tumor precisa ter arquitetura tubular; tumores com menos que isso são NST grau 1.'],
     ['Como reconhecer','Túbulos angulados, em gota, com lúmen aberto e uma camada só de células cúbicas, às vezes com projeções apicais. A ausência de mioepitélio separa o carcinoma das lesões esclerosantes benignas.'],
     ['Armadilha','Adenose esclerosante e cicatriz radial também têm túbulos em estroma fibroso, mas mantêm a dupla camada. Quando há dúvida, p63 e calponina positivas ao redor dos túbulos indicam lesão benigna.'],
     ['Perfil','Quase sempre RE e RP positivos, HER2 negativo e Ki-67 baixo (perfil luminal A). Metástase axilar é pouco frequente.']]},

  {id:'lobular',grupo:PM,cat:'Carcinomas invasivos',nome:'Carcinoma lobular invasivo clássico',tipo:'Carcinoma invasivo de tipo especial',coloracao:'H&E',arquivo:'MA-CLI-018.svs',tamanho:'1,74 GB',scanner:'Aperio GT 450',
   desc:'Células pequenas, uniformes e discoesas infiltram o estroma em fila indiana e se dispõem em anéis concêntricos ao redor de ductos preservados (padrão em alvo). O tumor quase não forma massa nem desmoplasia. Há um lóbulo distendido por células monótonas, sem lúmen, que corresponde a carcinoma lobular in situ.',
   caso:{paciente:'Mulher, 63 anos',local:'Mama esquerda, quadrante superolateral',clinico:'Espessamento mal definido, sem nódulo nítido, com leve retração da pele ao elevar os braços.',imagem:'Mamografia: assimetria focal com distorção arquitetural, mais evidente na incidência craniocaudal. Ressonância indica doença de 5 cm, maior que a estimada no exame clínico.',
     ddx:['Carcinoma invasivo de tipo não especial','Linfoma','Mastite crônica'],
     achados:['Células pequenas, uniformes e discoesas','Infiltração em fila indiana','Padrão em alvo ao redor de ductos','Carcinoma lobular in situ associado','Pouca desmoplasia','E-caderina negativa (ver lâmina de IHQ)']},
   aula:[['Conceito','Segundo tipo histológico mais comum, entre 10% e 15% dos carcinomas invasivos. A alteração definidora é a perda da E-caderina, por mutação ou silenciamento do gene CDH1, que tira a adesão entre as células.'],
     ['Como reconhecer','Células pequenas e monótonas, às vezes com vacúolo intracitoplasmático (células em anel de sinete), que infiltram em fila indiana e em alvo sem destruir as estruturas. Por isso o tumor costuma ser maior do que parece no exame clínico e na mamografia.'],
     ['IHQ','E-caderina negativa ou aberrante e p120 com padrão citoplasmático. Ductos normais da mesma lâmina servem de controle positivo. O tipo clássico é quase sempre RE positivo e HER2 negativo; a variante pleomórfica tem núcleos maiores e pior prognóstico.'],
     ['Por que importa','É mais frequentemente multicêntrico e bilateral, e a ressonância ajuda no planejamento cirúrgico. As metástases têm padrão próprio: peritônio, trato gastrointestinal, ovários e meninges.']]},

  {id:'mucinoso',grupo:PM,cat:'Carcinomas invasivos',nome:'Carcinoma mucinoso',tipo:'Carcinoma invasivo de tipo especial',coloracao:'H&E',arquivo:'MA-MUC-011.svs',tamanho:'1,28 GB',scanner:'Aperio GT 450',
   desc:'Ninhos de células tumorais de atipia leve a moderada flutuam em lagos de mucina extracelular, separados por septos fibrosos delicados. A lesão tem borda expansiva, bem delimitada, com estroma comprimido na periferia.',
   caso:{paciente:'Mulher, 74 anos',local:'Mama direita, região retroareolar',clinico:'Nódulo amolecido, móvel, de 2,5 cm, de crescimento lento.',imagem:'Mamografia: nódulo oval de margens microlobuladas, de aspecto pouco suspeito. Ultrassonografia: nódulo isoecoico com reforço acústico posterior (BI-RADS 4B).',
     ddx:['Lesão semelhante a mucocele','Fibroadenoma','Carcinoma invasivo de tipo não especial'],
     achados:['Lagos de mucina extracelular','Ninhos tumorais flutuando na mucina','Septos fibrosos delicados','Atipia leve a moderada','Borda expansiva']},
   aula:[['Conceito','Carcinoma invasivo de tipo especial em que a mucina extracelular ocupa grande parte do tumor. É puro quando mais de 90% da lesão é mucinosa; com componente NST relevante, chama-se misto.'],
     ['Perfil e prognóstico','Mais comum em mulheres idosas. Quase sempre RE e RP positivos e HER2 negativo. O tipo puro tem prognóstico favorável e baixa taxa de metástase axilar.'],
     ['Diagnóstico diferencial','A lesão semelhante a mucocele também tem mucina no estroma, mas o epitélio que se descola é benigno, com mioepitélio. Na imagem, o tumor pode parecer benigno por ter margens circunscritas.']]},

  {id:'medular',grupo:PM,cat:'Carcinomas invasivos',nome:'Carcinoma NST com padrão medular',tipo:'Carcinoma invasivo triplo-negativo rico em TILs',coloracao:'H&E',arquivo:'MA-MED-004.svs',tamanho:'1,46 GB',scanner:'Aperio GT 450',
   desc:'Lençóis sinciciais de células grandes, de núcleos vesiculosos e pleomorfismo acentuado, com mitoses numerosas e áreas de necrose. Entre os lençóis há infiltrado linfoplasmocitário denso. A borda é expansiva, empurrando o tecido vizinho.',
   caso:{paciente:'Mulher, 36 anos, mãe com câncer de ovário aos 45 anos',local:'Mama direita, quadrante inferolateral',clinico:'Nódulo de crescimento rápido, de 3 cm, móvel e bem delimitado.',imagem:'Ultrassonografia: nódulo oval, de margens circunscritas e microlobuladas, hipoecoico (BI-RADS 4C).',
     ddx:['Carcinoma invasivo de tipo não especial, grau 3','Linfoma','Fibroadenoma'],
     achados:['Crescimento sincicial em lençóis','Núcleos grandes e vesiculosos','Mitoses numerosas','Infiltrado linfoplasmocitário denso','Borda expansiva']},
   aula:[['Nomenclatura atual','A 5ª edição da OMS deixou de considerar o carcinoma medular um tipo especial. Esses tumores entram como carcinoma de tipo não especial com padrão medular, um extremo do espectro dos tumores ricos em TILs.'],
     ['Perfil','Geralmente triplo-negativos (RE, RP e HER2 negativos), de fenótipo basal e alto grau. Associam-se a mutação germinativa de BRCA1, por isso a paciente deve ser encaminhada para aconselhamento genético.'],
     ['TILs e prognóstico','A quantidade de TILs no estroma é avaliada em percentual e tem valor prognóstico e preditivo de resposta à quimioterapia neoadjuvante nos triplo-negativos. Apesar do alto grau, tumores ricos em TILs têm prognóstico melhor que o esperado.']]},

  {id:'re',grupo:BM,cat:'Imuno-histoquímica',nome:'RE positivo',tipo:'IHQ · receptor de estrogênio',coloracao:'IHQ · RE (clone SP1) · DAB e hematoxilina',arquivo:'MA-IHQ-RE-031.svs',tamanho:'1,41 GB',scanner:'Aperio GT 450',
   desc:'Marcação nuclear marrom (DAB) na maioria das células tumorais, com intensidade moderada a forte. O estroma é negativo e o ducto normal aprisionado mostra positividade heterogênea das células luminais, que funciona como controle interno.',
   caso:{paciente:'Mulher, 58 anos',local:'Mama direita, quadrante superolateral',clinico:'Carcinoma invasivo NST grau 2 na biópsia. Esta é a lâmina de RE do mesmo bloco.',imagem:'Massa irregular de 2 cm (BI-RADS 5).',
     ddx:['RE negativo','RE positivo baixo (1% a 10%)','Resultado inválido por falha do controle interno'],
     achados:['Marcação exclusivamente nuclear','Cerca de 90% das células tumorais positivas','Intensidade moderada a forte','Controle interno positivo no ducto normal','Estroma negativo']},
   aula:[['Como ler','Avalie apenas núcleos de carcinoma invasivo. Registre o percentual de células positivas e a intensidade média (fraca, moderada ou forte). Antes de concluir, confira se o controle interno (epitélio normal) está positivo.'],
     ['Pontos de corte (ASCO/CAP 2020)','Positivo: 1% ou mais de núcleos marcados. De 1% a 10% o resultado é relatado como positivo baixo, porque esses tumores se comportam de forma heterogênea e muitas vezes como RE negativo. Menos de 1% é negativo. O mesmo vale para o RP.'],
     ['Escore de Allred','Soma a proporção (0 a 5) e a intensidade (0 a 3). Nesta lâmina: proporção acima de 2/3 (5) e intensidade forte (3), total 8.'],
     ['Por que importa','Define elegibilidade para hormonioterapia (tamoxifeno, inibidores de aromatase) e, junto com RP, HER2 e Ki-67, o subtipo luminal.']]},

  {id:'ki67',grupo:BM,cat:'Imuno-histoquímica',nome:'Ki-67 alto',tipo:'IHQ · índice de proliferação',coloracao:'IHQ · Ki-67 (clone MIB-1) · DAB e hematoxilina',arquivo:'MA-IHQ-KI-031.svs',tamanho:'1,39 GB',scanner:'Aperio GT 450',
   desc:'Marcação nuclear em cerca de 40% das células tumorais, com intensidade variável. Figuras de mitose também são positivas. O epitélio do ducto normal tem raríssimas células marcadas.',
   caso:{paciente:'Mulher, 47 anos',local:'Mama esquerda',clinico:'Carcinoma invasivo NST grau 3. Lâmina de Ki-67 do mesmo bloco.',imagem:'Massa irregular de 3 cm (BI-RADS 5).',
     ddx:['Ki-67 baixo (até 5%)','Ki-67 intermediário (6% a 29%)','Resultado inválido por falha de fixação'],
     achados:['Marcação nuclear em cerca de 40% das células','Intensidade variável entre os núcleos','Mitoses positivas','Ducto normal com raras células positivas']},
   aula:[['Como ler','Conte o percentual de núcleos de carcinoma invasivo marcados, de qualquer intensidade. O International Ki-67 Working Group recomenda contagem padronizada (global, em vários campos, ou no ponto quente quando há heterogeneidade) e pelo menos algumas centenas de células.'],
     ['Pontos de corte','Em tumores RE positivos e HER2 negativos, o IKWG considera confiáveis apenas os extremos: até 5% é baixo e 30% ou mais é alto. Na faixa intermediária a reprodutibilidade entre laboratórios é ruim. O estudo monarchE usou 20% como corte para indicar abemaciclibe.'],
     ['Por que importa','Ajuda a separar luminal A (Ki-67 baixo) de luminal B (Ki-67 alto) quando não há assinatura genômica, e acompanha a resposta à hormonioterapia pré-operatória.']]},

  {id:'her2_3',grupo:BM,cat:'Imuno-histoquímica',nome:'HER2 3+ (positivo)',tipo:'IHQ · HER2',coloracao:'IHQ · HER2 (clone 4B5) · DAB e hematoxilina',arquivo:'MA-IHQ-H2-044.svs',tamanho:'1,47 GB',scanner:'Aperio GT 450',
   desc:'Marcação de membrana completa, circunferencial e intensa em mais de 10% das células tumorais, com aspecto de tela de galinheiro já visível em pequeno aumento. O estroma e o ducto normal são negativos.',
   caso:{paciente:'Mulher, 44 anos',local:'Mama esquerda',clinico:'Carcinoma invasivo NST grau 3, RE e RP negativos.',imagem:'Massa irregular de 4 cm com microcalcificações associadas.',
     ddx:['HER2 0','HER2 1+ (HER2-low)','HER2 2+ (equívoco)'],
     achados:['Membrana completa e circunferencial','Intensidade forte, visível em pequeno aumento','Mais de 10% das células tumorais','Estroma e ducto normal negativos']},
   aula:[['Critério (ASCO/CAP 2018, reafirmado em 2023)','3+: marcação de membrana completa e intensa em mais de 10% das células invasivas. É positivo sem necessidade de hibridização in situ.'],
     ['Como evitar erro','Ignore marcação citoplasmática, de carcinoma in situ e de bordas da peça (artefato de borda). Avalie em campo com fixação adequada (formalina tamponada por 6 a 72 horas).'],
     ['Por que importa','Indica terapia anti-HER2: trastuzumabe e pertuzumabe com quimioterapia, trastuzumabe entansina (T-DM1) quando há doença residual após neoadjuvância e trastuzumabe deruxtecana (T-DXd) na doença metastática.'],
     ['Subtipo','RE negativo com HER2 positivo corresponde ao subtipo HER2 enriquecido (não luminal); com RE positivo, luminal B HER2 positivo.']]},

  {id:'her2_2',grupo:BM,cat:'Imuno-histoquímica',nome:'HER2 2+ (equívoco)',tipo:'IHQ · HER2',coloracao:'IHQ · HER2 (clone 4B5) · DAB e hematoxilina',arquivo:'MA-IHQ-H2-052.svs',tamanho:'1,43 GB',scanner:'Aperio GT 450',
   desc:'Marcação de membrana completa, porém fraca a moderada, em mais de 10% das células tumorais. A tela de galinheiro só fica nítida em aumento médio ou grande. Resultado equívoco, que exige hibridização in situ.',
   caso:{paciente:'Mulher, 55 anos',local:'Mama direita',clinico:'Carcinoma invasivo NST grau 2, RE positivo.',imagem:'Massa irregular de 2,5 cm.',
     ddx:['HER2 1+ (HER2-low)','HER2 3+ (positivo)','HER2 0'],
     achados:['Membrana completa','Intensidade fraca a moderada','Mais de 10% das células','Necessidade de FISH ou outra técnica de hibridização']},
   aula:[['Critério','2+: marcação de membrana completa, fraca a moderada, em mais de 10% das células. O resultado é equívoco e não define o status sozinho.'],
     ['Próximo passo','Fazer hibridização in situ (FISH ou ISH de campo claro) no mesmo bloco. O resultado final vem da combinação da IHQ com a razão HER2/CEP17 e o número médio de cópias de HER2 (veja as lâminas de FISH e o Guia).'],
     ['HER2-low','Se a hibridização for negativa, o tumor é classificado como HER2-low (2+ sem amplificação), o que permite trastuzumabe deruxtecana na doença metastática após terapia prévia, conforme o estudo DESTINY-Breast04.']]},

  {id:'her2_1',grupo:BM,cat:'Imuno-histoquímica',nome:'HER2 1+ (HER2-low)',tipo:'IHQ · HER2',coloracao:'IHQ · HER2 (clone 4B5) · DAB e hematoxilina',arquivo:'MA-IHQ-H2-058.svs',tamanho:'1,40 GB',scanner:'Aperio GT 450',
   desc:'Marcação de membrana tênue e incompleta, em segmentos, em mais de 10% das células tumorais. Só é percebida em grande aumento. Não há membranas completas e intensas.',
   caso:{paciente:'Mulher, 66 anos',local:'Mama esquerda',clinico:'Carcinoma invasivo NST grau 2, RE positivo, com metástases ósseas na reavaliação.',imagem:'Massa irregular de 2 cm e lesões líticas em coluna.',
     ddx:['HER2 0','HER2 2+ (equívoco)','HER2 3+ (positivo)'],
     achados:['Membrana incompleta, em segmentos','Intensidade tênue, vista só em grande aumento','Mais de 10% das células','Sem membranas completas']},
   aula:[['Critério','1+: marcação de membrana incompleta, tênue ou quase imperceptível, em mais de 10% das células. É HER2 negativo pelos critérios clássicos, mas entra na categoria HER2-low.'],
     ['Separar 0 de 1+','A atualização ASCO/CAP de 2023 pede atenção para distinguir 0 de 1+, em grande aumento e com bons controles. Dentro do 0, a marcação tênue e incompleta em até 10% das células é chamada HER2-ultralow, categoria que ganhou relevância com o estudo DESTINY-Breast06.'],
     ['Por que importa','HER2-low (1+, ou 2+ sem amplificação) abre a possibilidade de trastuzumabe deruxtecana na doença metastática. Não muda a indicação de terapia anti-HER2 clássica.']]},

  {id:'ecad',grupo:BM,cat:'Imuno-histoquímica',nome:'E-caderina negativa no carcinoma lobular',tipo:'IHQ · adesão celular',coloracao:'IHQ · E-caderina (clone 36) · DAB e hematoxilina',arquivo:'MA-IHQ-EC-018.svs',tamanho:'1,52 GB',scanner:'Aperio GT 450',
   desc:'As células tumorais em fila indiana e as do carcinoma lobular in situ não mostram marcação de membrana. O epitélio luminal dos ductos normais tem membrana completa e intensa, que serve de controle positivo.',
   caso:{paciente:'Mulher, 63 anos',local:'Mama esquerda',clinico:'Carcinoma invasivo com células discoesas na H&E; dúvida entre lobular e NST.',imagem:'Distorção arquitetural de 5 cm na ressonância.',
     ddx:['E-caderina positiva (favorece NST)','E-caderina com marcação aberrante','Resultado inválido por falha do controle'],
     achados:['Ausência de marcação de membrana nas células tumorais','CLIS também negativo','Controle positivo no epitélio dos ductos normais']},
   aula:[['Para que serve','Ajuda a separar carcinoma lobular (E-caderina negativa) de NST (positiva) quando a morfologia é ambígua, e carcinoma lobular in situ de carcinoma ductal in situ sólido de baixo grau.'],
     ['Como ler','Avalie a membrana das células tumorais e compare com o epitélio normal da mesma lâmina. Cerca de 10% a 15% dos lobulares mostram marcação aberrante, fraca ou fragmentada; nesses casos, p120 citoplasmática e a morfologia definem o diagnóstico.'],
     ['Por que importa','O tipo lobular muda a avaliação da extensão (ressonância), a abordagem cirúrgica e a interpretação de margens.']]},

  {id:'fish_neg',grupo:BM,cat:'FISH',nome:'FISH HER2 não amplificado (grupo 5)',tipo:'FISH · HER2/CEP17',coloracao:'FISH · sonda dupla HER2 (vermelho) e CEP17 (verde) · contracoloração DAPI',arquivo:'MA-FISH-H2-052.tif',tamanho:'2,26 GB',scanner:'Metafer 4 · fluorescência',

/* ---------- Roteiros: busca por região no próprio renderizador ---------- */
function nearestCell(C,seed,jit,x,y,pred){
  const cx0=Math.floor(x/C),cy0=Math.floor(y/C);
  for(let r=0;r<16;r++){let best=null,bd=Infinity;
    for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;
      const p=R.cellPoint(cx0+i,cy0+j,C,seed,jit);if(pred&&!pred(p))continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;best=p;}}
    if(best)return best;}
  return {x,y,h:0};
}
function findReg(id,x0,y0,code,step=180,maxR=90){const ok=Array.isArray(code)?c=>code.includes(c):c=>c===code;
  for(let r=0;r<=maxR;r++){for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;
    const x=x0+i*step,y=y0+j*step;if(x<0||y<0||x>W||y>H)continue;const q=R.probe(id,x,y);if(q.m>0.97&&ok(q.reg))return {x,y};}}
  return {x:x0,y:y0};}
function walkReg(id,x,y,dx,dy,code,max=4000){for(let i=0;i<max;i++){const q=R.probe(id,x,y);if(q.reg===code)return {x,y};x+=dx;y+=dy;}return {x,y};}
function centerIn(id,p,code,st=20,max=200){let x=p.x,y=p.y;
  for(let pass=0;pass<2;pass++){const ext=(dx,dy)=>{let i=0;while(i<max&&R.probe(id,x+dx*(i+1)*st,y+dy*(i+1)*st).reg===code)i++;return i*st;};
    const l=ext(-1,0),r=ext(1,0);x+=(r-l)/2;const u=ext(0,-1),d=ext(0,1);y+=(d-u)/2;}
  return {x,y};}
function nucNear(id,x,y,code){const mt=R.meta(id);return nearestCell(mt.C,mt.seed,0.85,x,y,p=>R.probe(id,p.x,p.y).reg===code);}

const pool=(function(){
  let workers=[];const jobs=new Map();let nextId=1;
  function runMain(j){setTimeout(()=>{const d=j.d;j.resolve(R.renderPixels(d.slide,d.x0,d.y0,d.w,d.h,d.s));},0);}
  function broken(){const pend=[...jobs.values()];jobs.clear();workers.forEach(w=>{try{w.terminate();}catch(e){}});workers=[];pend.forEach(runMain);}
  try{
    const src='const R=('+rendererFactory.toString()+')();onmessage=function(e){var d=e.data;var px=R.renderPixels(d.slide,d.x0,d.y0,d.w,d.h,d.s);postMessage({id:d.id,buf:px.buffer},[px.buffer]);};';
    const url=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));

    for(let i=0;i<n;i++){const w=new Worker(url);w.busy=0;
      w.onmessage=e=>{w.busy--;const j=jobs.get(e.data.id);jobs.delete(e.data.id);if(j)j.resolve(new Uint8ClampedArray(e.data.buf));};
      w.onerror=ev=>{ev.preventDefault&&ev.preventDefault();broken();};workers.push(w);}

    render(d){return new Promise(resolve=>{const id=nextId++;d.id=id;const j={d,resolve};
      if(!workers.length){runMain(j);return;}jobs.set(id,j);const w=workers.reduce((a,b)=>a.busy<=b.busy?a:b);w.busy++;w.postMessage(d);});}

function makeSource(slide){
  const maxLevel=Math.ceil(Math.log2(Math.max(W,H)));
  return {width:W,height:H,tileSize:256,tileOverlap:0,minLevel:0,maxLevel,
    getTileUrl:(l,x,y)=>slide.id+'/'+l+'/'+x+'/'+y,
    downloadTileStart(ctx){

      const lw=Math.ceil(W/s),lh=Math.ceil(H/s),w=Math.max(1,Math.min(256,lw-X*256)),h=Math.max(1,Math.min(256,lh-Y*256));

async function initStore(){

    try{store.me=user?await user.id():null;}catch(e){}

function subscribeNotes(){
  if(store.unsub){try{store.unsub();}catch(e){}store.unsub=null;}clearTimeout(store.timer);store.error='';store.stale=false;

    store.unsub=store.db.collection('anotacoes').where('slide','==',slideId).onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(store.timer);store.stale=false;}
      if(!current||current.id!==slideId)return;
      notes=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.criado||0)-(b.criado||0));
      resolveNames();afterNotesChange();
    },err=>{clearTimeout(store.timer);store.error='Não foi possível carregar as anotações compartilhadas agora. Recarregue a página para tentar de novo.';renderNotesList();});
  } else if(store.mode==='local'){notes=(localAll()[current.id]||[]).slice();afterNotesChange();}

    if(n.tipo==='seta'){const L=15,h1={x:b.x-L*Math.cos(t-0.42),y:b.y-L*Math.sin(t-0.42)},h2={x:b.x-L*Math.cos(t+0.42),y:b.y-L*Math.sin(t+0.42)};s+=dual('polygon',`points="${P(b)} ${P(h1)} ${P(h2)}"`,c);}

    return `<polygon points="${q.map(P).join(' ')}" fill="${c}" fill-opacity=".08"/>`+dual('polygon',`points="${q.map(P).join(' ')}"`);}

function drawNotes(){

  if(Math.random()<0.35){const sl=path[Math.floor(Math.random()*path.length)];
    return {kind:'dx',slide:sl,prompt:sl.grupo===BM?'Qual é a leitura desta lâmina?':'Qual é o diagnóstico desta lesão?',answer:sl.nome,options:shuffle([sl.nome,...sl.caso.ddx]),expl:sl.desc};}
  const sl=SLIDES[Math.floor(Math.random()*SLIDES.length)];if(!sl.pois)sl.pois=buildPOIs(sl.id);
  const p=sl.pois[Math.floor(Math.random()*sl.pois.length)];
  const same=sl.pois.filter(x=>x.name!==p.name).map(x=>x.name),others=[];SLIDES.forEach(s=>{if(s!==sl){if(!s.pois)s.pois=buildPOIs(s.id);s.pois.forEach(x=>others.push(x.name));}});
  const pool2=[...new Set([...shuffle(same).slice(0,2),...shuffle(others)])].filter(n=>n!==p.name).slice(0,3);
  return {kind:'est',slide:sl,poi:p,prompt:'Qual estrutura está dentro do círculo tracejado?',answer:p.name,options:shuffle([p.name,...pool2]),expl:p.desc};
}
function startQuiz(){guideOn=false;btGuia.setAttribute('aria-pressed','false');closeEditor();setTool('');quiz.active=true;quiz.score=0;quiz.total=0;btQuiz.setAttribute('aria-pressed','true');stage.classList.add('quiz');catalogEl.classList.add('locked');nextQuestion();}
function endQuiz(){quiz.active=false;btQuiz.setAttribute('aria-pressed','false');stage.classList.remove('quiz');catalogEl.classList.remove('locked');reticle.hidden=true;renderRecord();drawNotes();}
function nextQuestion(){quiz.q=newQuestion();quiz.answered=null;const q=quiz.q;reticle.hidden=q.kind!=='est';
  const view=q.kind==='est'?{poi:q.poi}:{};if(current===q.slide)applyView(view);else selectSlide(q.slide.id,false,view);renderQuiz();}
function renderQuiz(){const q=quiz.q;if(!q)return;const a=quiz.answered;
  rec.innerHTML=`<p class="eyebrow">Modo estudo</p><h1>Quiz de identificação</h1><p class="score">${quiz.score} acerto${quiz.score===1?'':'s'} em ${quiz.total} pergunta${quiz.total===1?'':'s'}</p>
    <h2 style="margin-top:14px">${esc(q.prompt)}</h2><p class="desc" style="margin-bottom:10px">Você pode navegar e mudar o aumento antes de responder.</p>
    <div class="opts">${q.options.map(o=>`<button type="button" class="opt ${a?(o===q.answer?'right':(o===a?'wrong':'')):''}" data-o="${esc(o)}" ${a?'disabled':''}>${esc(o)}</button>`).join('')}</div>
    ${a?`<div class="fb ${a===q.answer?'ok':'no'}"><b>${a===q.answer?'Correto.':'Não é essa. A resposta é '+esc(q.answer)+'.'}</b>${esc(q.expl)}${q.kind==='est'?' <br><small>Lâmina: '+esc(q.slide.nome)+'</small>':''}</div>`:''}
    <div class="row">${a?'<button type="button" class="btn primary" id="qz-next">Próxima pergunta</button>':''}<button type="button" class="btn" id="qz-end">Encerrar quiz</button></div>`;
  rec.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{if(quiz.answered)return;quiz.answered=b.dataset.o;quiz.total++;if(b.dataset.o===q.answer)quiz.score++;renderQuiz();}));
  const n=rec.querySelector('#qz-next');if(n)n.addEventListener('click',nextQuestion);rec.querySelector('#qz-end').addEventListener('click',endQuiz);}
btQuiz.addEventListener('click',()=>quiz.active?endQuiz():startQuiz());
const btGuia=document.getElementById('bt-guia');btGuia.addEventListener('click',()=>{if(quiz.active)endQuiz();setGuide(!guideOn);});

/* ---------- Comparação lado a lado ---------- */
const btCmp=document.getElementById('bt-cmp'),pane2=document.getElementById('pane2'),cmpSel=document.getElementById('cmp-slide'),cmpSync=document.getElementById('cmp-sync');
const PAIRS={normal:'fibroadenoma',fibroadenoma:'normal',cdis:'cdi',cdi:'cdis',tubular:'cdi',lobular:'ecad',mucinoso:'tubular',medular:'cdi',re:'ki67',ki67:'re',her2_3:'her2_2',her2_2:'fish_amp',her2_1:'her2_2',ecad:'lobular',fish_neg:'fish_amp',fish_amp:'fish_neg'};
let viewer2=null,syncing=false;
SLIDES.forEach(sl=>{const o=document.createElement('option');o.value=sl.id;sl.opt=o;cmpSel.append(o);});
function cmpLabels(){SLIDES.forEach(sl=>sl.opt.textContent=dispName(sl));}
function zoomSync(src,dst,z){if(syncing||!cmpSync.checked||!dst||!dst.world.getItemCount()||!src.world.getItemCount())return;syncing=true;
  try{const iz=src.viewport.viewportToImageZoom(z);dst.viewport.zoomTo(dst.viewport.imageToViewportZoom(iz));}finally{syncing=false;}}
function openCompare(){
  stage.classList.add('split');pane2.hidden=false;btCmp.setAttribute('aria-pressed','true');cmpLabels();
  if(!viewer2){viewer2=OpenSeadragon(Object.assign({element:document.getElementById('viewer2')},OSD_OPTS));
    viewer2.addHandler('zoom',e=>zoomSync(viewer2,viewer,e.zoom));viewer.addHandler('zoom',e=>zoomSync(viewer,viewer2,e.zoom));
    viewer2.addHandler('open',()=>{if(cmpSync.checked)zoomSync(viewer,viewer2,viewer.viewport.getZoom());});}
  const pick=PAIRS[current.id]||SLIDES.find(s=>s!==current).id;cmpSel.value=pick;viewer2.open(makeSource(SLIDES.find(s=>s.id===pick)));
}
function closeCompare(){stage.classList.remove('split');pane2.hidden=true;btCmp.setAttribute('aria-pressed','false');}
btCmp.addEventListener('click',()=>pane2.hidden?openCompare():closeCompare());
document.getElementById('cmp-close').addEventListener('click',closeCompare);
cmpSel.addEventListener('change',()=>viewer2&&viewer2.open(makeSource(SLIDES.find(s=>s.id===cmpSel.value))));
document.getElementById('cego').addEventListener('change',cmpLabels);

/* ---------- Início ---------- */
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(!quiz.active&&SLIDES.some(s=>s.id===h))selectSlide(h,false);});
selectSlide((SLIDES.find(s=>s.id===location.hash.slice(1))||SLIDES[0]).id,false);
initStore();
</script>
